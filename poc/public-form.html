<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- CSP en <meta> : repli acceptable pour une page statique sans serveur applicatif (pas de
     frame-ancestors ici, ignoré par les navigateurs dans un <meta>, voir le README).
     connect-src doit rester ouvert à tout hôte https : #form=<lien> peut désigner n'importe
     quelle instance Grist, choisie par qui a publié ce lien, pas par cette page. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self' https:; object-src 'none'; base-uri 'none'">
<title>Formulaire</title>
<style>
  :root {
    --bg: #f5f6fa; --card: #ffffff; --text: #1e1e1e; --muted: #666; --border: #d9d9e0;
    --accent: #3452e1; --accent-text: #fff; --error: #ce0500; --ok: #18753c; --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161616; --card: #1f1f1f; --text: #f0f0f0; --muted: #a8a8a8; --border: #3a3a3a;
      --accent: #8585f6; --accent-text: #0b0b3b; --error: #ff7a70; --ok: #6ee7a0;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
  .card + .card { margin-top: 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0; font-size: .95rem; }
  .q { margin: 0 0 22px; }
  .q:last-child { margin-bottom: 0; }
  label.title { display: block; font-weight: 600; margin-bottom: 6px; }
  .req::after { content: " *"; color: var(--error); }
  .desc { color: var(--muted); font-size: .9rem; margin: -2px 0 8px; }
  input[type=text], input[type=number], input[type=date], input[type=datetime-local], input[type=email], textarea, select {
    width: 100%; padding: 10px 12px; font: inherit; color: inherit; background: transparent;
    border: 1px solid var(--border); border-radius: 6px;
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .opt { display: flex; gap: 10px; align-items: center; padding: 6px 0; }
  .opt input { width: 18px; height: 18px; accent-color: var(--accent); }
  .switch { display: flex; gap: 10px; align-items: center; }
  button { font: inherit; font-weight: 600; padding: 12px 20px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; }
  .primary { background: var(--accent); color: var(--accent-text); }
  .primary[disabled] { opacity: .6; cursor: progress; }
  .err { color: var(--error); font-size: .9rem; margin-top: 6px; display: none; }
  .q.invalid .err { display: block; }
  .q.invalid input, .q.invalid select, .q.invalid textarea { border-color: var(--error); }
  /* Les champs obligatoires portent l'attribut HTML natif `required` (jamais pour bloquer
     l'envoi : le <form> reste novalidate — mais lu par les lecteurs d'écran comme
     aria-required). Neutralise uniquement l'indication visuelle ":invalid" que certains
     navigateurs appliquent dès qu'un champ obligatoire est vide, avant tout envoi : seule notre
     propre classe .invalid doit piloter l'indication visuelle d'erreur, au moment voulu. */
  input:invalid, select:invalid, textarea:invalid { box-shadow: none; }
  .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .hp { position: absolute; left: -9999px; }
  .ok { color: var(--ok); }
  .center { text-align: center; }
  code { font-size: .85em; }
</style>
</head>
<body>
<main>
  <div id="app" class="card"><p class="sub">Chargement…</p></div>
</main>
<script src="public-form.js"></script>
</body>
</html>
